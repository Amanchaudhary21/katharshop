# application.properties - Spring Boot settings for the shop server.
# Your own settings (MySQL password, owner password, ngrok) go in the .env file in the main folder
# (see .env.example), not here. Windows environment variables with the same names work too.
spring.application.name=katharshop
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# A short window: only Katharshop's own messages and real problems
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.zaxxer.hikari=OFF

# The store and the API at http://localhost:8080 (Google sign-in needs this address).
# Only this computer can connect; other devices come in through the ngrok link.
server.port=${PORT:8080}
server.address=127.0.0.1
# ngrok passes on the visitor's real address (X-Forwarded-For); used to slow down password guessing
server.forward-headers-strategy=native
# the store's files are shown by WebConfig
spring.web.resources.add-mappings=false

# MySQL. The database is made the first time the server starts; MySqlStore makes the tables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopnest}?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
